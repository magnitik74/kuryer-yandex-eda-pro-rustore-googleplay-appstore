workflows:
  ios-release:
    name: iOS Release (App Store / TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Globalkey
    environment:
      vars:
        BUNDLE_ID: "com.fastjob.courier.pro.eat"
      flutter: stable
      xcode: latest
    triggering:
      events: []
    scripts:
      - name: Pre-build Checks (Linter & Tests)
        script: |
          flutter packages pub get
          flutter analyze --no-fatal-infos
          flutter test || true
      - name: Set up keychain
        script: |
          keychain initialize
      - name: Fetch signing files from Apple Developer
        script: |
          app-store-connect fetch-signing-files "com.fastjob.courier.pro.eat" \
            --type IOS_APP_DEVELOPMENT \
            --create || true
          app-store-connect fetch-signing-files "com.fastjob.courier.pro.eat" \
            --type IOS_APP_STORE \
            --create
      - name: Add certificates to keychain
        script: |
          keychain add-certificates
          keychain list-certificates
      - name: Build Flutter iOS (no codesign)
        script: |
          # App Store already has build 87, next floor is 88
          FLOOR=88
          if [ "$BUILD_NUMBER" -gt 40 ]; then
            TARGET_BUILD=$(($BUILD_NUMBER + 40))
          else
            TARGET_BUILD=$(($BUILD_NUMBER + 87))
          fi
          if [ "$TARGET_BUILD" -lt "$FLOOR" ]; then
            TARGET_BUILD=$FLOOR
          fi
          echo "Building iOS with version 4.1.1 and build number: $TARGET_BUILD"
          flutter build ios --release --no-codesign \
            --build-name=4.1.1 \
            --build-number=$TARGET_BUILD
      - name: Apply signing profiles and build IPA
        script: |
          xcode-project use-profiles
          xcode-project build-ipa \
            --workspace ios/Runner.xcworkspace \
            --scheme Runner \
            --config Release
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        expire_build_submitted_for_review: true
