workflows:
  ios-release:
    name: iOS Release (App Store / TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Globalkey
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.fastjob.courier.pro.eat
      vars:
        BUNDLE_ID: "com.fastjob.courier.pro.eat"
      flutter: stable
      xcode: latest
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: 'main'
          include: true
      tag_patterns:
        - pattern: 'v*'
          include: true
    scripts:
      - name: Set up keychain
        script: |
          keychain initialize
          keychain add-certificates
          keychain list-certificates
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Pre-build Checks (Linter & Tests)
        script: |
          flutter packages get
          flutter analyze --no-fatal-infos
          flutter test || true
      - name: Install CocoaPods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Flutter build IPA for App Store
        script: |
          # App Store already has build 87, next floor is 88
          FLOOR=88
          if [ "$BUILD_NUMBER" -gt 40 ]; then
            TARGET_BUILD=$(($BUILD_NUMBER + 40))
          else
            TARGET_BUILD=$(($BUILD_NUMBER + 87))
          fi
          if [ "$TARGET_BUILD" -lt "$FLOOR" ]; then
            TARGET_BUILD=$FLOOR
          fi
          echo "Building iOS IPA with version 4.1.1 and build number: $TARGET_BUILD"
          flutter build ipa --release \
            --build-name=4.1.1 \
            --build-number=$TARGET_BUILD \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        expire_build_submitted_for_review: true
