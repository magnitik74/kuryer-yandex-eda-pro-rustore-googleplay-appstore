workflows:
  ios-release:
    name: iOS Release Build
    max_build_duration: 120
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
    scripts:
      - name: Initialize keychain and fetch signing files
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "com.fastjob.courier.pro.eat" --project-type ios --create --distribution-type development
          app-store-connect fetch-signing-files "com.fastjob.courier.pro.eat" --project-type ios --create --distribution-type app_store
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Build Flutter iOS (no codesign)
        script: |
          flutter build ios --release --no-codesign
      - name: Apply signing profiles and build IPA
        script: |
          xcode-project use-profiles
          xcode-project build-ipa --workspace ios/Runner.xcworkspace --scheme Runner --config Release
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - mtrg4tptyd@privaterelay.appleid.com
