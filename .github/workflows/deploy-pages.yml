name: Deploy Pages to Public Repo

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'build/web/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4

      - name: Verify deploy token exists
        run: |
          if [ -z "${{ secrets.PAGES_DEPLOY_TOKEN }}" ]; then
            echo "::error::PAGES_DEPLOY_TOKEN secret is empty or not set!"
            exit 1
          else
            echo "PAGES_DEPLOY_TOKEN is set"
          fi

      - name: Clone or initialize public repo
        run: |
          set -euo pipefail
          TOKEN="${{ secrets.PAGES_DEPLOY_TOKEN }}"
          REPO="magnitik74/kurier-pro-eda-pages"
          echo "Token length: ${#TOKEN}"
          echo "Cloning $REPO..."
          cd /tmp
          if git clone "https://x-access-token:${TOKEN}@github.com/${REPO}.git" public 2>&1; then
            echo "Cloned existing repo"
            cd public
            if ! git rev-parse --verify main >/dev/null 2>&1; then
              echo "No main branch, creating..."
              git checkout --orphan main
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git rm -rf . >/dev/null 2>&1 || true
              echo "# kurier-pro-eda-pages" > README.md
              git add README.md
              git commit -m "Initial commit"
              git push -u origin main
            fi
          else
            echo "Clone failed, initializing fresh repo..."
            rm -rf public
            mkdir -p public
            cd public
            git init
            git checkout -b main
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            echo "# kurier-pro-eda-pages" > README.md
            git add README.md
            git commit -m "Initial commit"
            git remote add origin "https://x-access-token:${TOKEN}@github.com/${REPO}.git"
            git push -u origin main
          fi
          # Copy public to workspace for later steps
          cp -r /tmp/public ${GITHUB_WORKSPACE}/public

      - name: Copy docs to public
        run: |
          cp -r docs/* public/
          echo "Copied docs to public repo"

      - name: Copy Flutter web build if exists
        run: |
          if [ -d "build/web" ]; then
            mkdir -p public/demo
            cp -r build/web/* public/demo/
            echo "Copied Flutter web build to public/demo"
          else
            echo "No Flutter web build found (build/web), skipping"
          fi

      - name: Commit and push to public repo
        run: |
          cd public
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Deploy from kuryer-yandex-eda-pro: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}