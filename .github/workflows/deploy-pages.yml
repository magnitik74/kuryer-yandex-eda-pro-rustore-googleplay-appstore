name: Deploy Pages to Public Repo

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'build/web/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4

      - name: Verify deploy token exists
        run: |
          if [ -z "${{ secrets.PAGES_DEPLOY_TOKEN }}" ]; then
            echo "::error::PAGES_DEPLOY_TOKEN secret is empty or not set!"
            exit 1
          else
            echo "PAGES_DEPLOY_TOKEN is set (length: ${{ length(secrets.PAGES_DEPLOY_TOKEN) }})"
          fi

      - name: Checkout public repo
        uses: actions/checkout@v4
        with:
          repository: magnitik74/kurier-pro-eda-pages
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          path: public
          persist-credentials: true

      - name: Copy docs to public
        run: |
          cp -r docs/* public/
          echo "Copied docs to public repo"

      - name: Copy Flutter web build if exists
        run: |
          if [ -d "build/web" ]; then
            mkdir -p public/demo
            cp -r build/web/* public/demo/
            echo "Copied Flutter web build to public/demo"
          else
            echo "No Flutter web build found (build/web), skipping"
          fi

      - name: Commit and push to public repo
        run: |
          cd public
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Deploy from kuryer-yandex-eda-pro: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}