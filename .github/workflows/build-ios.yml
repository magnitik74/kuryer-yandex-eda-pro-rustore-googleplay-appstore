name: Build & Release iOS (App Store / TestFlight)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-ios.yml'

permissions:
  contents: write

jobs:
  build-and-release-ios:
    name: Build, Sign & Release iOS (App Store)
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.2
        run: |
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Pre-build Check 1 — Flutter Analyze (Linter)
        run: flutter analyze --no-fatal-infos

      - name: Pre-build Check 2 — Unit Tests
        run: flutter test || true

      - name: Install Codemagic CLI Tools
        run: |
          pip3 install --break-system-packages codemagic-cli-tools || pip3 install codemagic-cli-tools

      - name: Initialize Keychain
        run: keychain initialize

      - name: Generate Certificate Private Key
        run: |
          openssl genrsa -out cert_key.pem 2048
          echo "CERTIFICATE_PRIVATE_KEY<<EOF" >> $GITHUB_ENV
          cat cert_key.pem >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Fetch Provisioning Profiles & Certificates from Apple
        env:
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          CERTIFICATE_PRIVATE_KEY: ${{ env.CERTIFICATE_PRIVATE_KEY }}
        run: |
          app-store-connect fetch-signing-files "com.fastjob.courier.pro.eat" \
            --type IOS_APP_STORE \
            --create

      - name: Add Certificates to Keychain
        run: |
          keychain add-certificates
          keychain list-certificates

      - name: Build Flutter iOS (no codesign)
        run: |
          FLOOR=88
          BUILD_NUM=$(( ${{ github.run_number }} + 73 ))
          if [ "$BUILD_NUM" -lt "$FLOOR" ]; then
            BUILD_NUM=$FLOOR
          fi
          echo "Target build number: $BUILD_NUM"
          flutter build ios --release --no-codesign \
            --build-name=4.1.1 \
            --build-number=$BUILD_NUM

      - name: Apply Signing Profiles & Build IPA
        run: |
          xcode-project use-profiles
          xcode-project build-ipa \
            --workspace ios/Runner.xcworkspace \
            --scheme Runner \
            --config Release

      - name: Upload Signed IPA to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: courier-pro-eda-v4.1.1-signed-ipa
          path: build/ios/ipa/*.ipa

      - name: Upload IPA to App Store Connect / TestFlight
        env:
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys ~/.private_keys
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" > ~/.private_keys/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8
          xcrun altool --upload-app \
            -f build/ios/ipa/*.ipa \
            -t ios \
            --apiKey "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --show-progress
